[workspace]
resolver = "3"
members = [
    "crates/mikuru-core",
    "crates/mikuru-backend",
    "crates/mikuru-cli",
    "crates/mikuru-transformer",
    "crates/mikuru-ncm",
    "crates/mikuru-tokenizer",
    "crates/mikuru-trainer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
burn = {
    version = "0.22",
    default-features = false,
    features = ["std", "autodiff", "optim", "flex", "store", "rayon"]
}
